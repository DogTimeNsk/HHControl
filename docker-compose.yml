services:
  api:
    build: { context: ., dockerfile: Dockerfile.backend }
    env_file: .env
    volumes: [hh_data:/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  scheduler:
    build: { context: ., dockerfile: Dockerfile.backend }
    command: ["python", "-m", "app.scheduler.runner"]
    env_file: .env
    volumes: [hh_data:/data]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
  browser:
    build: { context: ., dockerfile: Dockerfile.browser }
    env_file: .env
    volumes: [browser_data:/browser-data]
    restart: unless-stopped
  frontend:
    build: { context: ., dockerfile: Dockerfile.frontend }
    # Nginx on the host is the only public entry point in production.
    ports: ["${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"]
    depends_on: { api: { condition: service_healthy }, browser: { condition: service_started } }
    restart: unless-stopped
volumes:
  hh_data:
  browser_data:
