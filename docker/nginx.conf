server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # Docker's embedded DNS is dynamic. Variables make Nginx re-resolve services
  # after `api` or `browser` containers are recreated.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location ~ ^/api/(.*)$ { set $api_upstream http://api:8000; proxy_pass $api_upstream/api/$1$is_args$args; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  # noVNC is privileged: its screen can expose the user's HH account. Nginx
  # asks the API to verify the same signed session cookie used by the dashboard
  # before proxying every asset and the WebSocket handshake.
  location = /_internal/browser-access {
    internal;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream/api/browser/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
  }
  location ~ ^/browser/(.*)$ {
    auth_request /_internal/browser-access;
    set $browser_upstream http://browser:6080;
    proxy_pass $browser_upstream/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  location = /hh/redirect { set $callback_upstream http://api:8000/api/oauth/callback$is_args$args; proxy_pass $callback_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri $uri/ /index.html; }
}
